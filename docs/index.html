        local function tryClipboard(text)
            local copyFunctions = {}
            if typeof(setclipboard) == "function" then
                table.insert(copyFunctions, setclipboard)
            end
            if typeof(toclipboard) == "function" then
                table.insert(copyFunctions, toclipboard)
            end
            if typeof(set_clipboard) == "function" then
                table.insert(copyFunctions, set_clipboard)
            end
            for _, copyFunction in ipairs(copyFunctions) do
                local success = pcall(copyFunction, text)
                if success then return true end
            end
            return false
        end

        local function getRequestFunction()
            if typeof(request) == "function" then return request end

        local function renderDiscord(data)
            local status = data.discord_status or "offline"
            statusDot.BackgroundColor3 = STATUS_COLOR[status] or COLORS.Offline
            local discordUser = data.discord_user or {}
            discordName.Text = discordUser.global_name or discordUser.username or CONFIG.USERNAME
            if updateDiscordAvatarFromData then
                updateDiscordAvatarFromData(discordUser)
            end
            local activities = data.activities or {}
            local customStatus
            local otherActivity
            for _, activity in ipairs(activities) do
                if activity.type == 4 then
                    customStatus = customStatus or activity
                elseif not otherActivity then
                    otherActivity = activity
                end
            end
            if otherActivity then
                discordActivity.Text = ((ACTIVITY_VERB[otherActivity.type] or "") .. " " .. (otherActivity.name or "Activity")):gsub("^%s+", "")
            elseif data.listening_to_spotify and data.spotify then
                discordActivity.Text = "Listening to Spotify — " .. tostring(data.spotify.song or "") .. " by " .. tostring(data.spotify.artist or "")
            elseif customStatus and customStatus.state then
                discordActivity.Text = customStatus.state
            else
                discordActivity.Text = STATUS_LABEL[status] or "Unknown"
            end
        end

        local function fetchDiscordStatus()
            if CONFIG.DISCORD_USER_ID == "" then
                discordActivity.Text = "Discord ID not configured"
                return
            end
            local requestFunction = getRequestFunction()
            if not requestFunction then
                discordActivity.Text = "Live status needs HTTP support"
                statusDot.BackgroundColor3 = COLORS.Offline
                return
            end
            local ok, responseOrError = pcall(function()
                return requestFunction({
                    Url = "https://api.lanyard.rest/v1/users/" .. CONFIG.DISCORD_USER_ID,
                    Method = "GET",
                })
            end)
            if not ok or typeof(responseOrError) ~= "table" then
                discordActivity.Text = "Discord status unavailable"
                statusDot.BackgroundColor3 = COLORS.Offline
                return
            end
            local body = responseOrError.Body or responseOrError.body
            if typeof(body) ~= "string" then
                discordActivity.Text = "Discord status unavailable"
                statusDot.BackgroundColor3 = COLORS.Offline
                return
            end
            local decodedOk, decoded = pcall(function()
                return HttpService:JSONDecode(body)
            end)
            if not decodedOk or typeof(decoded) ~= "table" or decoded.success ~= true or typeof(decoded.data) ~= "table" then
                discordActivity.Text = "Discord status unavailable"
                statusDot.BackgroundColor3 = COLORS.Offline
                return
            end
            renderDiscord(decoded.data)
        end

        local camera = workspace.CurrentCamera
        local initialViewport = camera and camera.ViewportSize or Vector2.new(800, 600)
        local cursorPosition = Vector2.new(initialViewport.X * 0.5, initialViewport.Y * 0.5)
        local HITBOX_PADDING = 6
        local hoveredControl = nil

        local function getCursorPoint()
            local position = cursor.AbsolutePosition
            local size = cursor.AbsoluteSize
            return Vector2.new(position.X + size.X * 0.5, position.Y + size.Y * 0.5)
        end

        local function containsPoint(object, point)
            if not object or not object.Parent or not object.Visible then return false end
            local pos = object.AbsolutePosition
            local size = object.AbsoluteSize
            return point.X >= pos.X - HITBOX_PADDING and point.X <= pos.X + size.X + HITBOX_PADDING
                and point.Y >= pos.Y - HITBOX_PADDING and point.Y <= pos.Y + size.Y + HITBOX_PADDING
        end

        local function controlAt(point)
            if intro.Parent and intro.Visible then return intro end
            if toast.Visible and copyTextBox.Visible and containsPoint(copyTextBox, point) then return copyTextBox end
            for _, entry in ipairs(socialButtons) do
                if containsPoint(entry.Button, point) then return entry.Button end
            end
            if containsPoint(volumeTrack, point) or containsPoint(volumeControl, point) then return volumeTrack end
            return nil
        end

        local function styleHover(control, enabled)
            if control == intro then
                intro.TextColor3 = enabled and COLORS.GreenHover or COLORS.Green
                return
            end
            for _, entry in ipairs(socialButtons) do
                if control == entry.Button then
                    entry.Stroke.Color = enabled and COLORS.BorderStrong or COLORS.Border
                    entry.Stroke.Transparency = enabled and 0 or 0.35
                    if entry.Button.Text ~= "" then
                        entry.Button.TextColor3 = enabled and COLORS.Green or COLORS.White
                    end
                    entry.Icon.ImageColor3 = enabled and COLORS.Green or COLORS.White
                    return
                end
            end
        end

        local function setHovered(control)
            if hoveredControl == control then return end
            if hoveredControl then
                styleHover(hoveredControl, false)
            end
            hoveredControl = control
            if hoveredControl then
                styleHover(hoveredControl, true)
            end
        end

        local function handleControlClick(control)
            if not control then return end
            if control == intro then
                activateIntro()
                return
            end
            if control == volumeTrack then
                draggingVolume = true
                setVolumeFromX(getCursorPoint().X)
                return
            end
            if control == copyTextBox then
                pcall(function()
                    copyTextBox:CaptureFocus()
                    copyTextBox.SelectionStart = 1
                    copyTextBox.CursorPosition = #copyTextBox.Text + 1
                end)
                return
            end
            for _, entry in ipairs(socialButtons) do
                if control == entry.Button then
                    copyLink(entry.Key, entry.URL)
                    return
                end
            end
        end
        connect(UserInputService.InputBegan, function(input, gameProcessed)
            if input.KeyCode == Enum.KeyCode.Escape then
                closeGUI()
                return
            end
            if closing then return end
            if input.UserInputType == Enum.UserInputType.MouseButton1 then
                handleControlClick(controlAt(getCursorPoint()))
            end
        end)
        connect(UserInputService.InputEnded, function(input)
            if input.UserInputType == Enum.UserInputType.MouseButton1 or input.UserInputType == Enum.UserInputType.Touch then
                draggingVolume = false
            end
        end)
        connect(RunService.RenderStepped, function()
            if closing or not gui.Parent then return end
            if UserInputService.MouseBehavior ~= Enum.MouseBehavior.LockCenter then
                UserInputService.MouseBehavior = Enum.MouseBehavior.LockCenter
            end
            if UserInputService.MouseIconEnabled then
                UserInputService.MouseIconEnabled = false
            end
            local currentCamera = workspace.CurrentCamera
            local viewport = currentCamera and currentCamera.ViewportSize or initialViewport
            local delta = Vector2.zero
            pcall(function()
                delta = UserInputService:GetMouseDelta()
            end)
            cursorPosition = Vector2.new(
                math.clamp(cursorPosition.X + delta.X, 0, viewport.X),
                math.clamp(cursorPosition.Y + delta.Y, 0, viewport.Y)
            )
            cursor.Position = UDim2.fromOffset(cursorPosition.X, cursorPosition.Y)
            local point = getCursorPoint()
            if draggingVolume then
                setVolumeFromX(point.X)
            end
            setHovered(controlAt(point))
        end)
	</script>

    <script>
      /* CONFIG — редактируй только это. */
      const CONFIG = {
        USERNAME: "CUCUMBER",
        DESCRIPTION: "................................HI............................",

        // Сайт, который откроется после нажатия на CUCUMBER.
        CUCUMBER_URL: "https://delivery-2347.github.io/CUCUMBER.html",

        AVATAR_URL: "https://r2.guns.lol/f280cc4c-c902-4393-8dc8-91c2d624a068.webp",
        TELEGRAM_URL: "https://t.me/kykymbit",
        DISCORD_URL: "https://discord.com/users/1499474505943486489",
        GITHUB_URL: "https://github.com/delivery-2347",
        ROBLOX_URL: "https://www.roblox.com/users/4110423563/profile",
        STEAM_URL: "https://steamcommunity.com/id/cucumber_2347",
        DISCORD_USER_ID: "1499474505943486489",
        DISCORD_AVATAR_URL: "",
        LANYARD_POLL_INTERVAL_MS: 20000,
        SOUND_URL: "https://r2.guns.lol/62bf662f-eae4-4614-acd7-0f2fcf088ac1.mp3",
        SOUND_VOLUME: 0.35,
        SOUND_LOOP: true,
        TIMEZONE: "Europe/Kyiv"
      };

      /* ---- Intro screen + click-to-start background sound ---- */
      const soundAudio = new Audio();
      soundAudio.loop = CONFIG.SOUND_LOOP !== false;
      soundAudio.preload = "auto";

      const volumeSlider = document.getElementById("volumeSlider");
      const introScreen = document.getElementById("introScreen");
      const introButton = document.getElementById("introButton");
      const configuredVolume = Number.isFinite(Number(CONFIG.SOUND_VOLUME))
        ? Math.min(1, Math.max(0, Number(CONFIG.SOUND_VOLUME)))
        : 0.35;
      let experienceStarted = false;

      function syncVolumeControl() {
        const percent = Number(volumeSlider.value);
        soundAudio.volume = percent / 100;
        volumeSlider.style.background = `linear-gradient(
          90deg,
          var(--green-bright) 0%,
          var(--green-bright) ${percent}%,
          rgba(138, 143, 140, .35) ${percent}%,
          rgba(138, 143, 140, .35) 100%
        )`;
      }

      function initSound() {
        volumeSlider.value = String(Math.round(configuredVolume * 100));
        syncVolumeControl();

        if (!CONFIG.SOUND_URL) return;
        soundAudio.src = CONFIG.SOUND_URL;
        soundAudio.volume = configuredVolume;
        soundAudio.muted = false;
        soundAudio.addEventListener("error", function () {
          console.error("Background audio failed to load. Check CONFIG.SOUND_URL.", soundAudio.error);
        });
      }

      function startExperience() {
        if (experienceStarted) return;
        experienceStarted = true;
        introButton.disabled = true;

        // Call play() directly inside the user's click handler, before the animation.
        // This is the most reliable way to satisfy browsers' user-gesture audio policy.
        if (CONFIG.SOUND_URL) {
          soundAudio.muted = false;
          soundAudio.volume = Number(volumeSlider.value) / 100;
          try {
            const playPromise = soundAudio.play();
            if (playPromise && typeof playPromise.catch === "function") {
              playPromise.catch(function (error) {
                console.error("Background audio did not start:", error);
              });
            }
          } catch (error) {
            console.error("Background audio did not start:", error);
          }
        }

        introScreen.classList.add("is-leaving");
        window.setTimeout(function () {
          introScreen.classList.add("is-gone");
        }, 950);
      }

      // Clicking the text or any part of the black screen enters the profile.
      introScreen.addEventListener("click", startExperience);

      volumeSlider.addEventListener("input", function () {
        syncVolumeControl();
        // A fallback retry if the browser/device rejected playback on entry.
        if (experienceStarted && soundAudio.paused && CONFIG.SOUND_URL) {
          try {
            const playPromise = soundAudio.play();
            if (playPromise && typeof playPromise.catch === "function") {
              playPromise.catch(function (error) {
                console.error("Background audio did not start:", error);
              });
            }
          } catch (error) {
            console.error("Background audio did not start:", error);
          }
        }
      });

      const FALLBACK_AVATAR_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='1.5'%3E%3Ccircle cx='12' cy='8' r='4'/%3E%3Cpath d='M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8'/%3E%3C/svg%3E";

      function createCucumberDestinationUrl() {
        if (!CONFIG.CUCUMBER_URL) {
          return "#";
        }

        try {
          const destination = new URL(CONFIG.CUCUMBER_URL, window.location.href);
          destination.searchParams.set("via", "cucumber");
          return destination.href;
        } catch (error) {
          console.error("Invalid CONFIG.CUCUMBER_URL:", error);
          return "#";
        }
      }

      function initText() {
        const titleLink = document.getElementById("title");
        titleLink.textContent = CONFIG.USERNAME;
        titleLink.href = createCucumberDestinationUrl();
        titleLink.referrerPolicy = "strict-origin-when-cross-origin";

        document.getElementById("description").textContent = CONFIG.DESCRIPTION;

      }
      // Browser tab title animation: type the name, pause, erase, and repeat.
      const animatedTabTitle = "Cucumber";
      let tabTitleLength = 0;
      let tabTitleDeleting = false;

      function animateTabTitle() {
        document.title = tabTitleLength === 0 ? "\u200B" : animatedTabTitle.slice(0, tabTitleLength); 

        let nextDelay = 150;

        if (!tabTitleDeleting && tabTitleLength < animatedTabTitle.length) {
          tabTitleLength += 1;
          nextDelay = 150;
        } else if (!tabTitleDeleting) {
          tabTitleDeleting = true;
          nextDelay = 1100;
        } else if (tabTitleLength > 0) {
          tabTitleLength -= 1;
          nextDelay = 90;
        } else {
          tabTitleDeleting = false;
          nextDelay = 450;
        }

        window.setTimeout(animateTabTitle, nextDelay);
      }

      function initAvatar() {
        const img = document.getElementById("avatar");
        if (CONFIG.AVATAR_URL) {
          img.src = CONFIG.AVATAR_URL;
          img.onerror = function () {
            img.removeAttribute("src");
            img.classList.add("placeholder");
          };
        } else {
          img.classList.add("placeholder");
        }
      }

      function initButtons() {
        document.querySelectorAll(".btn[data-key]").forEach(function (btn) {
          const key = btn.dataset.key.toUpperCase() + "_URL";
          const url = CONFIG[key];
          if (url) {
            btn.href = url;
          } else {
            btn.href = "#";
            btn.setAttribute("aria-disabled", "true");
          }
        });
      }

      const discordAvatarEl = document.getElementById("discordAvatar");
      const discordNameEl = document.getElementById("discordName");
      const discordActivityEl = document.getElementById("discordActivity");
      const statusDotEl = document.getElementById("statusDot");
      const ACTIVITY_VERB = {
        0: "Playing",
        1: "Streaming",
        2: "Listening to",
        3: "Watching",
        5: "Competing in"
      };

      const STATUS_LABEL = {
        online: "Online",
        idle: "Idle",
        dnd: "Do Not Disturb",
        offline: "Offline"
      };
      function showDiscordUnavailable(message) {
        discordNameEl.textContent = CONFIG.USERNAME;
        discordActivityEl.textContent = message || "Discord status unavailable";
        statusDotEl.className = "status-dot status-offline";
        discordAvatarEl.src = CONFIG.DISCORD_AVATAR_URL || FALLBACK_AVATAR_SVG;
      }
      function renderDiscord(data) {
        const status = data.discord_status || "offline";
        statusDotEl.className = "status-dot status-" + status;
        const user = data.discord_user || {};
        discordNameEl.textContent = user.global_name || user.username || CONFIG.USERNAME;
        let avatarSrc = CONFIG.DISCORD_AVATAR_URL;
        if (!avatarSrc && user.avatar && user.id) {
          avatarSrc = "https://cdn.discordapp.com/avatars/" +
            user.id + "/" + user.avatar + ".png?size=64";
        }
        discordAvatarEl.src = avatarSrc || FALLBACK_AVATAR_SVG;
        const activities = data.activities || [];
        const customStatus = activities.find(function (activity) {
          return activity.type === 4;
        });
        const otherActivity = activities.find(function (activity) {
          return activity.type !== 4;
        });

        let activityText;
        if (otherActivity) {
          const verb = ACTIVITY_VERB[otherActivity.type] || "";
          activityText = (verb + " " + otherActivity.name).trim();
        } else if (data.listening_to_spotify && data.spotify) {
          activityText = "Listening to Spotify — " +
            data.spotify.song + " by " + data.spotify.artist;
        } else if (customStatus && customStatus.state) {
          activityText = customStatus.state;
        } else {
          activityText = STATUS_LABEL[status] || "Unknown";
        }

        discordActivityEl.textContent = activityText;
      }
      async function fetchDiscordStatus() {
        if (!CONFIG.DISCORD_USER_ID) {
          showDiscordUnavailable("Discord ID not configured");
          return;
        }
        try {
          const res = await fetch(
            "https://api.lanyard.rest/v1/users/" + CONFIG.DISCORD_USER_ID
          );
          if (!res.ok) throw new Error("Lanyard request failed: " + res.status);
          const json = await res.json();
          if (!json.success) throw new Error("Lanyard returned an error");
          renderDiscord(json.data);
        } catch (err) {
          console.error(err);
          showDiscordUnavailable();
        }
      }

      const clockEl = document.getElementById("clock");
      const clockFormatter = new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
        timeZone: CONFIG.TIMEZONE
      });

      function updateClock() {
        clockEl.textContent = clockFormatter.format(new Date());
      }

      // Keep one feature's failure from preventing independent page features from initializing.
      function safelyInitialize(name, fn) {
        try {
          fn();
        } catch (error) {
          console.error("Initialization failed: " + name, error);
        }
      }
      safelyInitialize("text", initText);
      safelyInitialize("tab title animation", animateTabTitle);
      safelyInitialize("avatar", initAvatar);
      safelyInitialize("social buttons", initButtons);
      safelyInitialize("sound", initSound);
      safelyInitialize("Discord status", function () {
        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, CONFIG.LANYARD_POLL_INTERVAL_MS);
      });
      safelyInitialize("clock", function () {
        updateClock();
        setInterval(updateClock, 10000);
      });
    </script>
  </body>
