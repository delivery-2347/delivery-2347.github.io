      .avatar {

        background: transparent;

      .volume-slider::-webkit-slider-thumb {

        background: var(--white);

        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;

      }
      .intro-screen.is-gone {

      }

        -webkit-appearance: none;

    <script>
      const CONFIG = {
        USERNAME: "CUCUMBER",
        DESCRIPTION: "................................HI............................",

        CUCUMBER_URL: "https://delivery-2347.github.io/CUCUMBER.html",

        AVATAR_URL: "https://r2.guns.lol/f280cc4c-c902-4393-8dc8-91c2d624a068.webp",
        TELEGRAM_URL: "https://t.me/kykymbit",
        DISCORD_URL: "https://discord.com/users/1499474505943486489",
        GITHUB_URL: "https://github.com/delivery-2347",
        ROBLOX_URL: "https://www.roblox.com/users/4110423563/profile",
        STEAM_URL: "https://steamcommunity.com/id/cucumber_2347",
        DISCORD_USER_ID: "1499474505943486489",
        DISCORD_AVATAR_URL: "",
        LANYARD_POLL_INTERVAL_MS: 20000,
        SOUND_URL: "https://r2.guns.lol/62bf662f-eae4-4614-acd7-0f2fcf088ac1.mp3",
        SOUND_VOLUME: 0.35,
        SOUND_LOOP: true,
        TIMEZONE: "Europe/Kyiv"
      };

      const soundAudio = new Audio();
      soundAudio.loop = CONFIG.SOUND_LOOP !== false;
      soundAudio.preload = "auto";

      const volumeSlider = document.getElementById("volumeSlider");
      const introScreen = document.getElementById("introScreen");
      const introButton = document.getElementById("introButton");
      const configuredVolume = Number.isFinite(Number(CONFIG.SOUND_VOLUME))
        ? Math.min(1, Math.max(0, Number(CONFIG.SOUND_VOLUME)))
        : 0.35;
      let experienceStarted = false;

      function syncVolumeControl() {
        const percent = Number(volumeSlider.value);
        soundAudio.volume = percent / 100;
        volumeSlider.style.background = `linear-gradient(
          90deg,
          var(--green-bright) 0%,
          var(--green-bright) ${percent}%,
          rgba(138, 143, 140, .35) ${percent}%,
          rgba(138, 143, 140, .35) 100%
        )`;
      }

      function initSound() {
        volumeSlider.value = String(Math.round(configuredVolume * 100));
        syncVolumeControl();

        if (!CONFIG.SOUND_URL) return;
        soundAudio.src = CONFIG.SOUND_URL;
        soundAudio.volume = configuredVolume;
        soundAudio.muted = false;
        soundAudio.addEventListener("error", function () {
          console.error("Background audio failed to load. Check CONFIG.SOUND_URL.", soundAudio.error);
        });
      }

      function startExperience() {
        if (experienceStarted) return;
        experienceStarted = true;
        introButton.disabled = true;

        if (CONFIG.SOUND_URL) {
          soundAudio.muted = false;
          soundAudio.volume = Number(volumeSlider.value) / 100;
          try {
            const playPromise = soundAudio.play();
            if (playPromise && typeof playPromise.catch === "function") {
              playPromise.catch(function (error) {
                console.error("Background audio did not start:", error);
              });
            }
          } catch (error) {
            console.error("Background audio did not start:", error);
          }
        }

        introScreen.classList.add("is-leaving");
        window.setTimeout(function () {
          introScreen.classList.add("is-gone");
        }, 950);
      }

      introScreen.addEventListener("click", startExperience);

      volumeSlider.addEventListener("input", function () {
        syncVolumeControl();
        if (experienceStarted && soundAudio.paused && CONFIG.SOUND_URL) {
          try {
            const playPromise = soundAudio.play();
            if (playPromise && typeof playPromise.catch === "function") {
              playPromise.catch(function (error) {
                console.error("Background audio did not start:", error);
              });
            }
          } catch (error) {
            console.error("Background audio did not start:", error);
          }
        }
      });

      const FALLBACK_AVATAR_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='1.5'%3E%3Ccircle cx='12' cy='8' r='4'/%3E%3Cpath d='M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8'/%3E%3C/svg%3E";

      function createCucumberDestinationUrl() {
        if (!CONFIG.CUCUMBER_URL) {
          return "#";
        }

        try {
          const destination = new URL(CONFIG.CUCUMBER_URL, window.location.href);
          destination.searchParams.set("via", "cucumber");
          return destination.href;
        } catch (error) {
          console.error("Invalid CONFIG.CUCUMBER_URL:", error);
          return "#";
        }
      }

      function initText() {
        const titleLink = document.getElementById("title");
        titleLink.textContent = CONFIG.USERNAME;
        titleLink.href = createCucumberDestinationUrl();
        titleLink.referrerPolicy = "strict-origin-when-cross-origin";

        document.getElementById("description").textContent = CONFIG.DESCRIPTION;

      }
      const animatedTabTitle = "Cucumber";
      let tabTitleLength = 0;
      let tabTitleDeleting = false;

      function animateTabTitle() {
        document.title = tabTitleLength === 0 ? "\u200B" : animatedTabTitle.slice(0, tabTitleLength); 

        let nextDelay = 150;

        if (!tabTitleDeleting && tabTitleLength < animatedTabTitle.length) {
          tabTitleLength += 1;
          nextDelay = 150;
        } else if (!tabTitleDeleting) {
          tabTitleDeleting = true;
          nextDelay = 1100;
        } else if (tabTitleLength > 0) {
          tabTitleLength -= 1;
          nextDelay = 90;
        } else {
          tabTitleDeleting = false;
          nextDelay = 450;
        }

        window.setTimeout(animateTabTitle, nextDelay);
      }

      function initAvatar() {
        const img = document.getElementById("avatar");
        if (CONFIG.AVATAR_URL) {
          img.src = CONFIG.AVATAR_URL;
          img.onerror = function () {
            img.removeAttribute("src");
            img.classList.add("placeholder");
          };
        } else {
          img.classList.add("placeholder");
        }
      }

      function initButtons() {
        document.querySelectorAll(".btn[data-key]").forEach(function (btn) {
          const key = btn.dataset.key.toUpperCase() + "_URL";
          const url = CONFIG[key];
          if (url) {
            btn.href = url;
          } else {
            btn.href = "#";
            btn.setAttribute("aria-disabled", "true");
          }
        });
      }

      const discordAvatarEl = document.getElementById("discordAvatar");
      const discordNameEl = document.getElementById("discordName");
      const discordActivityEl = document.getElementById("discordActivity");
      const statusDotEl = document.getElementById("statusDot");
      const ACTIVITY_VERB = {
        0: "Playing",
        1: "Streaming",
        2: "Listening to",
        3: "Watching",
        5: "Competing in"
      };

      const STATUS_LABEL = {
        online: "Online",
        idle: "Idle",
        dnd: "Do Not Disturb",
        offline: "Offline"
      };
      function showDiscordUnavailable(message) {
        discordNameEl.textContent = CONFIG.USERNAME;
        discordActivityEl.textContent = message || "Discord status unavailable";
        statusDotEl.className = "status-dot status-offline";
        discordAvatarEl.src = CONFIG.DISCORD_AVATAR_URL || FALLBACK_AVATAR_SVG;
      }
      function renderDiscord(data) {
        const status = data.discord_status || "offline";
        statusDotEl.className = "status-dot status-" + status;
        const user = data.discord_user || {};
        discordNameEl.textContent = user.global_name || user.username || CONFIG.USERNAME;
        let avatarSrc = CONFIG.DISCORD_AVATAR_URL;
        if (!avatarSrc && user.avatar && user.id) {
          avatarSrc = "https://cdn.discordapp.com/avatars/" +
            user.id + "/" + user.avatar + ".png?size=64";
        }
        discordAvatarEl.src = avatarSrc || FALLBACK_AVATAR_SVG;
        const activities = data.activities || [];
        const customStatus = activities.find(function (activity) {
          return activity.type === 4;
        });
        const otherActivity = activities.find(function (activity) {
          return activity.type !== 4;
        });

        let activityText;
        if (otherActivity) {
          const verb = ACTIVITY_VERB[otherActivity.type] || "";
          activityText = (verb + " " + otherActivity.name).trim();
        } else if (data.listening_to_spotify && data.spotify) {
          activityText = "Listening to Spotify — " +
            data.spotify.song + " by " + data.spotify.artist;
        } else if (customStatus && customStatus.state) {
          activityText = customStatus.state;
        } else {
          activityText = STATUS_LABEL[status] || "Unknown";
        }

        discordActivityEl.textContent = activityText;
      }
      async function fetchDiscordStatus() {
        if (!CONFIG.DISCORD_USER_ID) {
          showDiscordUnavailable("Discord ID not configured");
          return;
        }
        try {
          const res = await fetch(
            "https://api.lanyard.rest/v1/users/" + CONFIG.DISCORD_USER_ID
          );
          if (!res.ok) throw new Error("Lanyard request failed: " + res.status);
          const json = await res.json();
          if (!json.success) throw new Error("Lanyard returned an error");
          renderDiscord(json.data);
        } catch (err) {
          console.error(err);
          showDiscordUnavailable();
        }
      }

      const clockEl = document.getElementById("clock");
      const clockFormatter = new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
        timeZone: CONFIG.TIMEZONE
      });

      function updateClock() {
        clockEl.textContent = clockFormatter.format(new Date());
      }

      // Keep one feature's failure from preventing independent page features from initializing.
      function safelyInitialize(name, fn) {
        try {
          fn();
        } catch (error) {
          console.error("Initialization failed: " + name, error);
        }
      }
      safelyInitialize("text", initText);
      safelyInitialize("tab title animation", animateTabTitle);
      safelyInitialize("avatar", initAvatar);
      safelyInitialize("social buttons", initButtons);
      safelyInitialize("sound", initSound);
      safelyInitialize("Discord status", function () {
        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, CONFIG.LANYARD_POLL_INTERVAL_MS);
      });
      safelyInitialize("clock", function () {
        updateClock();
        setInterval(updateClock, 10000);
      });
    </script>
  </body>
</html>
