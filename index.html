<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     НАСТРОЙКИ — меняй ссылки и текст прямо тут, в JS-блоке внизу
     (ищи объект CONFIG в конце файла)
     ============================================================ */

  :root{
    --bg-base:#0b0d14;
    --overlay-top: rgba(11,13,20,.35);
    --overlay-bottom: rgba(11,13,20,.92);
    --panel-bg: rgba(255,255,255,0.045);
    --panel-border: rgba(255,255,255,0.09);
    --text-primary:#f2f1f6;
    --text-muted:#9a98ac;
    --accent:#3ecf8e;
    --accent-soft: rgba(62,207,142,.35);
    --radius-lg: 22px;
    --radius-sm: 14px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text-primary);
    background:var(--bg-base);
  }

  a{ color:inherit; text-decoration:none; }

  /* ---------- фон ---------- */
  .bg-layer{
    position:fixed;
    inset:0;
    z-index:0;
    background-size:cover;
    background-position:center;
    background-color:var(--bg-base);
    filter:saturate(1.05);
  }
  .bg-layer::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, var(--overlay-top) 0%, var(--overlay-bottom) 78%),
      radial-gradient(ellipse at 50% 15%, rgba(62,207,142,.10), transparent 55%);
  }

  /* ---------- Spotify-виджет ---------- */
  .spotify-wrap{
    margin:0 0 24px;
    border-radius:var(--radius-sm);
    overflow:hidden;
    border:1px solid var(--panel-border);
    background:rgba(255,255,255,.02);
    box-shadow:0 0 0 1px rgba(0,0,0,.15) inset;
  }
  .spotify-wrap iframe{
    display:block;
    vertical-align:top;
  }

  /* ---------- карточка профиля ---------- */
  .page{
    position:relative;
    z-index:1;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .profile-card{
    width:100%;
    max-width:400px;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: var(--radius-lg);
    padding:38px 28px 30px;
    text-align:center;
  }

  .avatar-ring{
    width:104px;
    height:104px;
    margin:0 auto 20px;
    border-radius:50%;
    padding:4px;
    background:
      radial-gradient(circle at 30% 20%, var(--accent), transparent 60%),
      conic-gradient(from 0deg, var(--accent-soft), transparent 30%, var(--accent-soft));
    animation: ring-breathe 4.5s ease-in-out infinite;
  }
  @keyframes ring-breathe{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.35); }
  }
  @media (prefers-reduced-motion: reduce){
    .avatar-ring{ animation:none; }
  }

  .avatar-ring img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:#1c1e29;
  }

  .name{
    font-family:'Sora', sans-serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 6px;
    letter-spacing:.2px;
  }

  .tagline{
    font-size:13.5px;
    line-height:1.5;
    color:var(--text-muted);
    margin:0 0 28px;
    padding:0 8px;
  }

  .links-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
  }

  .link-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    flex:0 1 calc((100% - 24px) / 3);
    padding:14px 6px 12px;
    border-radius:var(--radius-sm);
    background:rgba(255,255,255,.03);
    border:1px solid transparent;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .link-btn:hover, .link-btn:focus-visible{
    transform:translateY(-3px);
    border-color:var(--accent-soft);
    background:rgba(255,255,255,.06);
  }
  .link-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .icon{
    width:26px;
    height:26px;
    display:grid;
    place-items:center;
    color:var(--text-primary);
  }
  .icon svg{ width:100%; height:100%; fill:currentColor; }
  .icon img{ width:100%; height:100%; object-fit:contain; border-radius:6px; }

  .label{
    font-size:11.5px;
    color:var(--text-muted);
  }

  @media (max-width:380px){
    .profile-card{ padding:30px 18px 24px; }
    .links-row{ gap:9px; }
    .link-btn{ flex-basis: calc((100% - 18px) / 3); }
  }
</style>
</head>
<body>

  <div class="bg-layer" id="bgLayer"></div>

  <div class="page">
    <main class="profile-card">
      <div class="avatar-ring">
        <img id="avatarImg" src="" alt="Аватар">
      </div>
      <h1 class="name" id="displayName"></h1>
      <p class="tagline" id="tagline"></p>

      <div class="spotify-wrap">
        <iframe id="spotifyEmbed" src="" width="100%" height="152" frameborder="0"
          allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy" title="Spotify player"></iframe>
      </div>

      <nav class="links-row">
        <a class="link-btn" id="link-discord" target="_blank" rel="noopener noreferrer">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028 14.09 14.09 0 001.226-1.994.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/></svg></span>
          <span class="label">Discord</span>
        </a>

        <a class="link-btn" id="link-roblox" target="_blank" rel="noopener noreferrer">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M5.164 0 .16 18.928 18.836 24 23.84 5.072Zm8.747 15.354-5.219-1.417 1.399-5.29 5.22 1.418-1.4 5.29Z"/></svg></span>
          <span class="label">Roblox</span>
        </a>

        <a class="link-btn" id="link-tiktok" target="_blank" rel="noopener noreferrer">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.3 1.77-.16.75-.14 1.61.22 2.29.37.73 1.04 1.32 1.79 1.53 1.22.35 2.65-.03 3.4-1.04.53-.73.65-1.63.62-2.51-.01-3.84-.02-7.68-.01-11.51.01-.04.01-.08.01-.13z"/></svg></span>
          <span class="label">TikTok</span>
        </a>

        <a class="link-btn" id="link-github" target="_blank" rel="noopener noreferrer">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.084-.729.084-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.4 3-.405 1.02.005 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.21 0 1.6-.015 2.89-.015 3.285 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></span>
          <span class="label">GitHub</span>
        </a>

        <a class="link-btn" id="link-steam" target="_blank" rel="noopener noreferrer">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658a3.387 3.387 0 011.912-.59c.063 0 .125.004.188.006l2.861-4.142V8.91a4.528 4.528 0 014.524-4.524c2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159a3.392 3.392 0 01-3.39 3.396 3.412 3.412 0 01-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25a2.551 2.551 0 003.337-3.324 2.547 2.547 0 00-3.255-1.413l1.523.63a1.878 1.878 0 01-1.445 3.467H7.54zm11.415-9.303a3.019 3.019 0 00-3.015-3.015 3.015 3.015 0 103.015 3.015zm-5.273-.005a2.264 2.264 0 114.531 0 2.267 2.267 0 01-2.266 2.265 2.264 2.264 0 01-2.265-2.265z"/></svg></span>
          <span class="label">Steam</span>
        </a>
      </nav>
    </main>
  </div>

<script>
  /* ============================================================
     ЗАПОЛНИ ЭТИ ПЕРЕМЕННЫЕ СВОИМИ ДАННЫМИ
     ============================================================ */
  const CONFIG = {
    backgroundImage: "https://i.ibb.co/PZPSMGPh/Roblox-Screen-Shot20260705-231748436.png",   // ссылка на картинку фона, например "https://i.imgur.com/xxxx.jpg"

    // ID трека Spotify — бери его из ссылки на встраивание:
    // https://open.spotify.com/embed/track/ЭТОТ_КУСОК?utm_source=...
    spotifyTrackId: "3UXhoCvMithO5QWrx0sNle",

    avatarUrl: "https://i.ibb.co/Rpt6bj00/galaktic.png",         // ссылка на твою аватарку (например, из Discord)
    displayName: "Cucumber",
    tagline: "HI",

    // иконка вкладки браузера (favicon)
    faviconUrl: "https://i.ibb.co/twngNkVM/Roblox-Screen-Shot20260812-040642324.png",

    // печать названия вкладки по буквам: true/false — включить/выключить,
    // ms — задержка между буквами
    tabBlink: { enabled: true, intervalMs: 250 },

    links: {
      discord: "https://discord.com/users/1499474505943486489",
      roblox: "https://www.roblox.com/users/4110423563/profile",
      tiktok: "https://www.tiktok.com/@cucumber_2347",
      github: "https://github.com/delivery-2347",
      steam: "https://steamcommunity.com/id/cucumber_2347"
    }
  };

  // --- применяем конфиг ---
  document.getElementById("bgLayer").style.backgroundImage = CONFIG.backgroundImage ? `url("${CONFIG.backgroundImage}")` : "none";
  document.getElementById("avatarImg").src = CONFIG.avatarUrl;
  document.getElementById("displayName").textContent = CONFIG.displayName;
  document.getElementById("tagline").textContent = CONFIG.tagline;

  document.getElementById("link-discord").href = CONFIG.links.discord;
  document.getElementById("link-roblox").href = CONFIG.links.roblox;
  document.getElementById("link-tiktok").href = CONFIG.links.tiktok;
  document.getElementById("link-github").href = CONFIG.links.github;
  document.getElementById("link-steam").href = CONFIG.links.steam;

  // --- Spotify-виджет ---
  if (CONFIG.spotifyTrackId) {
    document.getElementById("spotifyEmbed").src =
      `https://open.spotify.com/embed/track/${CONFIG.spotifyTrackId}?utm_source=generator&theme=0`;
  }

  // --- иконка вкладки (favicon) ---
  if (CONFIG.faviconUrl) {
    let iconLink = document.querySelector("link[rel~='icon']");
    if (!iconLink) {
      iconLink = document.createElement("link");
      iconLink.rel = "icon";
      document.head.appendChild(iconLink);
    }
    iconLink.href = CONFIG.faviconUrl;
  }

  // --- название вкладки печатается туда-обратно: '' → c → cu → ... → cucumber → ... → c → '' → снова ---
  if (CONFIG.tabBlink && CONFIG.tabBlink.enabled && CONFIG.displayName) {
    const fullName = CONFIG.displayName;
    const n = fullName.length;
    const seq = [];
    for (let i = 0; i <= n; i++) seq.push(i);      // вверх: 0..n
    for (let i = n - 1; i >= 1; i--) seq.push(i);  // вниз: n-1..1 (без повтора концов)
    let idx = 0;
    setInterval(() => {
      document.title = fullName.slice(0, seq[idx]);
      idx = (idx + 1) % seq.length;
    }, CONFIG.tabBlink.intervalMs || 250);
  }
</script>

</body>
</html>
